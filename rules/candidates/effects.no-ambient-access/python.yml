id: effects.no-ambient-access/python-ambient-read
language: python
severity: hint
message: "an ambient read (clock, environment or randomness): pass it in or inject a service"
rule:
  any:
    - kind: call
      has:
        field: function
        regex: '^((datetime\.)?datetime\.(now|utcnow)|(datetime\.)?date\.today|time\.time|os\.getenv|random\.[A-Za-z_0-9]+|uuid\.uuid4)$'
    - kind: attribute
      regex: '^os\.environ$'
