id: failures.expected-vs-defect/typescript-throw
language: typescript
severity: hint
message: "a `throw` of a value that is not a `new \u2026Error(\u2026)`: an untyped failure"
rule:
  kind: throw_statement
  not:
    has:
      kind: new_expression
      has:
        field: constructor
        regex: 'Error$'
