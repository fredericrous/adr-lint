id: types.exhaustive-matching/rust-wildcard-arm
language: rust
severity: hint
message: "a `_ =>` arm: it defeats the compiler's exhaustiveness check on the crate's own enum"
rule:
  kind: match_arm
  has:
    kind: match_pattern
    regex: '^_(\s|$)'
  inside:
    kind: match_block
    not:
      has:
        kind: match_arm
        has:
          kind: match_pattern
          any:
            - has:
                any:
                  - kind: string_literal
                  - kind: char_literal
                  - kind: integer_literal
                  - kind: negative_literal
            - has:
                kind: or_pattern
                has:
                  any:
                    - kind: string_literal
                    - kind: char_literal
                    - kind: integer_literal
                    - kind: negative_literal
