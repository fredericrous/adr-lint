id: names.reveal-intent/rust-trait-suffix
language: rust
severity: warning
message: "a trait named with a `Trait` suffix: name it for what it does"
rule:
  kind: trait_item
  has:
    field: name
    regex: '^.+Trait$'
---
id: names.reveal-intent/rust-member-prefix
language: rust
severity: warning
message: "a name with an `m_` member prefix"
rule:
  regex: '^m_'
  any:
    - kind: identifier
    - kind: field_identifier
