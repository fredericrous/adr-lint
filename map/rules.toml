# The mechanism behind each exact or candidate class of an active
# governs:code constraint, and what it does not catch. `adr-lint coverage`
# checks this file against `aval rules --governs code --full`.
#
# Per-path decision overrides: aval has no machine-readable answer for one
# yet, so an exact rule is waived inline with a reason.
# holds-until: an accepted decision overrides an exact rule at a scope
# narrower than the repository; then aval gets an effective-rule answer and
# adr-lint consumes it (ADR-0044).

[rules."architecture.dependency-rule"]
exact = "the layer contracts in `adr-lint.toml`: depguard, no-restricted-imports, import-linter, ast-grep `use` paths"
misses = "A coupling that is not an import (shared names, a data format, a call through a string)."

[rules."boundaries.own-the-interface"]
exact = "the adapter paths in `adr-lint.toml`"
misses = "Wrapping done in a place the adapter paths do not list; whether the interface is the application's own."

[rules."change.a-new-dependency-is-owned"]
candidate = "a line added (and whose dependency name is not on a line the same file's diff removes: a version bump is not a new entry) to `[dependencies]`/`[dev-dependencies]` (or a `[dependencies.<name>]` table) of a Cargo.toml, a `require` of go.mod, `dependencies`/`devDependencies` of package.json, or `dependencies` of pyproject.toml; read by `adr-lint candidates` from the diff itself (src/candidates.rs), not by ast-grep"
misses = "A dependency declared in a manifest form the scan does not read (package.json `peerDependencies` and `optionalDependencies`; a multi-line inline table whose continuation lines are not entries; every Cargo or pyproject table whose name ends in `dependencies` is read, build, workspace and target tables included); whether the argument beside it is sound."

[rules."cli.basics.exit-status"]
exact = "`adr-lint cli-probe`: an unknown flag exits 2"
misses = "Codes other than an unknown flag (a failure that exits 1 where 3 is meant); exit codes on paths the probe does not run."

[rules."cli.basics.stdout-is-data-stderr-is-talk"]
candidate = "ast-grep rules rules/candidates/cli.basics.stdout-is-data-stderr-is-talk: `println!`/`print!` in Rust, `fmt.Print`/`Println`/`Printf` in Go, `console.log` in TS/TSX, `print(` without `file=` in Python; the output module is read as any file whose name is `output`, `out` or `render`, which `adr-lint candidates` leaves out"
misses = "Output written through a helper or macro the pattern does not name; stdout that is the asked-for data; an output module under another file name (the heuristic is the file stem output/out/render)."

[rules."cli.help.help-and-version"]
exact = "`adr-lint cli-probe`: `-h`, `--help`, `--bogus --help` and `--version` exit 0"
misses = "Help on stdout, `-v`, subcommand help, `tool help sub`, and anything the probe does not invoke."

[rules."comments.accurate-or-deleted"]
candidate = "ast-grep rules rules/candidates/comments.accurate-or-deleted (Rust, Go, TS/TSX, Python): a comment containing `@author` or a banner of ten or more repeated `=`, `-` or `*`"
misses = "Commented-out code (no rule is shipped: ast-grep cannot tell a line that parses as code from prose in a comment); a comment that is stale rather than a banner."

[rules."components.acyclic-dependencies"]
exact = "import/no-cycle, import-linter, the Go compiler, Cargo between crates"
misses = "A cycle between modules inside one crate; ecosystems without a cycle linter."

[rules."data.rows-stay-in-the-adapter"]
exact = "the adapter paths in `adr-lint.toml`"
misses = "A row type that leaks through a path outside the adapter list; whether the mapping step is a real translation."

[rules."dependencies.explicit"]
candidate = "ast-grep rules rules/candidates/dependencies.explicit: a Rust `static mut`, `OnceLock` static or `lazy_static!`, a Go package-level `var`, a TS/TSX module-level `let`"
misses = "A global reached through a name the pattern does not know; a service locator that is not a singleton."

[rules."domain.independent-of-infrastructure"]
exact = "the layer contracts in `adr-lint.toml`"
misses = "A coupling that is not an import; domain code in a path the contracts do not list."

[rules."effects.no-ambient-access"]
exact = "ast-grep for clock, randomness and environment reads outside the paths `adr-lint.toml` allows"
misses = "Configuration and global-state reads; ambient reads through a wrapper in an allowed path."

[rules."errors.never-swallowed"]
exact = "the TypeScript `adr-lint/no-swallowed-catch` of @aval-adr/eslint-config, and the ast-grep rules embedded in `adr-lint check` (rules/errors.never-swallowed): a TS/TSX Effect `catchAll` to void without a same-line comment. errcheck, clippy let_underscore_must_use, ruff S110 and no-empty are deliberately unused: none reads the same-line comment the rule allows"
candidate = "ast-grep rules rules/candidates/errors.never-swallowed, each dropped when a comment sits on the same line: a Rust `let _ =` of a call, `.await` or macro (not a bare identifier or literal), a Rust `.ok();` statement, a Go assignment whose left sides are all `_` and whose right side is a call or an `err`-named identifier, a Python `except` whose body is only `pass`"
misses = "A Go call that drops its error result without `_`, which needs types to see; a Go `v, _ := f()`, whose left side is not all blank; a Rust `let _ = res;` of a bare identifier, left out on purpose; a Python `except` that holds a comment line above `pass`, which tree-sitter takes into the clause so the pass-only match stops matching; a discard with a comment that is not true."

[rules."failures.expected-vs-defect"]
candidate = "ast-grep rules rules/candidates/failures.expected-vs-defect: Rust `.unwrap()`, `.expect(` and `panic!`, Go `panic(`, a TS/TSX `throw` of anything but `new …Error(…)`"
misses = "Test code is left out (a test file by the tests.no-real-waits conventions, and a Rust `mod` carrying `#[cfg(test)]`): an unwrap or panic in a test is the test's assertion. A panic reached through a helper or a macro the patterns do not name; whether a flagged `unwrap` has its invariant proven is the reviewer's ruling."

[rules."formatting.one-style-by-tool"]
exact = "cargo-fmt, gofmt, the repository's Prettier or Biome config, ruff format"
misses = "Formatting of a language with no listed formatter; a hand-formatted block inside a generated file."

[rules."functions.no-flag-arguments"]
candidate = "ast-grep rules rules/candidates/functions.no-flag-arguments: a `bool`/`boolean` parameter in Rust, Go, TS/TSX and Python (a Go named result such as `(ok bool)` is not a parameter)"
misses = "A string or integer selector compared against literals (no rule is shipped: the comparison sits in the body, away from the parameter); a flag hidden in a struct field or an enum of two cases."

[rules."functions.no-hidden-side-effects"]
candidate = "ast-grep rules rules/candidates/functions.no-hidden-side-effects: a Rust `&mut` parameter other than `self` outside an `impl … for …` block, a Go pointer parameter that the function assigns through (`p.f = …`, `*p = …`)"
misses = "A `&mut` out-parameter inside a trait impl; hidden mutation through interior mutability."

[rules."general.no-disabled-safety"]
exact = "ban-ts-comment, eslint-comments, ruff PGH003/PGH004/RUF100, clippy allow_attributes_without_reason, nolintlint, the ast-grep rules embedded in `adr-lint check` (rules/general.no-disabled-safety): a Python file-level `# ruff: noqa` and `# pyright: basic`, `adr-lint sync --check` for a loosened config"
misses = "A skipped test or a weakened assertion; a config loosened in a file `sync --check` does not cover."

[rules."names.reveal-intent"]
exact = "the ast-grep rules embedded in `adr-lint check` (rules/names.reveal-intent): an `I` prefix on a TS/TSX interface, a Rust `Trait` suffix, an `m_` prefix in Rust, TS, Go or Python"
candidate = "ast-grep rules rules/candidates/names.reveal-intent (Rust, Go, TS/TSX, Python): a single letter other than i, j or k, or one of data, result, value, item, tmp, obj, cfg, ctx, mgr, svc, as a declared name (let, var, parameter of a named function); closure parameters, range and for-of variables and the init of a three-clause for are not declarations here"
misses = "Names that are poor but spelled normally; a placeholder word inside a longer name; Python `self.m_x` assignments and TS `this.m_x` in a constructor are not caught by the `m_` rule; `IPv4Address`-style acronyms followed by a lower-case word are still flagged by the TS `I` prefix rule."

[rules."reliability.every-wait-is-bounded"]
candidate = "ast-grep rules rules/candidates/reliability.every-wait-is-bounded: Rust `reqwest::Client::new()` and `reqwest::get(`, Go `http.Get(` and `http.Client{}` without `Timeout`, TS/TSX `fetch(` without a `signal`"
misses = "A timeout set by a wrapper the pattern does not see; a wait that is not a network call (lock, subprocess, poll loop)."

[rules."reliability.retries-are-bounded"]
candidate = "ast-grep rules rules/candidates/reliability.retries-are-bounded (Rust, Go, TS/TSX, Python): a `loop`/`while true`/`for {}`/`while (true)`/`while True` whose body sleeps and has no bound: in Go, no comparison against an integer literal, no deadline read (`time.Since`, `time.Until`, `ctx.Done()`, `ctx.Err()`) and no ordering comparison beside a counter the loop increments; in the other languages, no comparison at all"
misses = "A retry written as a recursive call or an event loop; a bound that exists but is not reached; outside Go, a loop whose body compares anything at all (an `err != nil` or `status === 200` check) is taken as bounded and not marked; in Go an `err != nil` alone is not a bound, but any comparison against an integer literal is (so `resp.StatusCode == 500` clears an unbounded retry), a counter is recognised by shape, not by tracing that the compared name is the incremented one, and a deadline read (`time.Since`, `ctx.Done()`) clears the loop even when nothing compares or selects on it."

[rules."tests.first-properties"]
exact = "the ast-grep rules embedded in `adr-lint check` (rules/tests.first-properties): a Rust `#[ignore]` with no reason, a TS/TSX `it.skip`, `test.skip` or `describe.skip` with no comment on its line or the line above, a Go `t.Skip()` with no argument"
misses = "An ignore with a reason that is not an owner; independence, repeatability and speed; a Playwright reason given as a template string is flagged."

[rules."tests.no-real-waits"]
candidate = "ast-grep rules rules/candidates/tests.no-real-waits: `thread::sleep`/`sleep`, `time.Sleep`, `setTimeout`/`sleep`/`waitForTimeout`, `time.sleep`, kept only in a file under a test, tests, __tests__ or spec directory or named *_test.go, test_*.py, *_test.py, *.test.*, *.spec.* or *_test.rs (so `attest.rs` and `latest.ts` are not test files)"
misses = "A wait through a helper whose name is not sleep; a sleep in a test helper outside test files."

[rules."types.exhaustive-matching"]
exact = "switch-exhaustiveness-check, golangci exhaustive, the Rust compiler"
candidate = "ast-grep rule rules/candidates/types.exhaustive-matching: a Rust `_ =>` match arm, left out when another arm of the same match is a string, char or integer literal pattern (the scrutinee's type is not checked beyond that)"
misses = "A missing arm the compiler cannot see, such as a string tag compared against literals."

[rules."values.immutable-by-default"]
candidate = "ast-grep rules rules/candidates/values.immutable-by-default: Go assignment to an index of a slice or map parameter, TS/TSX assignment to a parameter, to one of its properties or to one of its indexes"
misses = "A mutation through an alias or a method call; a write two properties deep (`a.b.c = …`); mutation of a received collection in a language without the pattern."
