name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    # A pull request proves the primary platform, Linux; macOS, the other
    # platform the tap ships, is proven on main after the merge (ADR-0041,
    # ci.platform-schedule). The steps are the local gate itself.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The version `adr-lint check` demands; `make rules` and the check
      # tests need exactly it.
      - run: npm install --global @ast-grep/cli@0.51.0
      - run: make check

  msrv:
    # The declared rust-version, measured: Cargo.toml says why 1.85.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from Cargo.toml, the one place it is written.
      - run: rustup toolchain install "$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml).0" --profile minimal
      - run: make msrv
