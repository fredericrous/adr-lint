[package]
name = "adr-lint"
version = "0.8.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/fredericrous/adr-lint"
authors = ["Frederic Rousseau"]
description = "Checks a tree against the decided code rules a linter matches exactly, and marks candidate lines for reviewers (ADR-0044)"
readme = "README.md"
categories = ["development-tools", "command-line-utilities"]

# Measured: `cargo +1.85.0 check --locked` succeeds; the lowest the resolved
# tree allows is toml 1.1.6's own rust-version = "1.85" (1.74 cannot even read
# the v4 lockfile). The `msrv` CI job builds with this version.
rust-version = "1.85"

[[bin]]
name = "adr-lint"
path = "src/main.rs"

# Each dependency is argued beside its declaration (change.dependency-bar):
# what adr-lint links is what a gate trusts.
[dependencies]
# aval's `--json` output. Owning a JSON parser costs more than owning
# serde_json; used as `Value`, without serde derive (no syn/quote tree).
# Pulls serde_core, itoa, memchr, zmij; no build script downloads anything.
serde_json = "1"
# The rules map, `map/rules.toml`: TOML is a specified format. Only the
# `parse` and `serde` (Table/Value) features; no writer, no `display`.
# Pulls serde_core, serde_spanned, toml_datetime, toml_parser, winnow.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# `adr-lint sync` edits a person's Cargo.toml and must keep their comments,
# key order and spacing, which the `toml` crate's writer does not. Only the
# `parse` and `display` features (no serde). Pulls indexmap, equivalent,
# hashbrown, toml_writer (the rest is shared with `toml`); no build script.
# Releases several times a year, maintained with the `toml` crate in toml-rs.
# If it is abandoned, `sync` is its only user: the `toml` crate's parser stays
# for everything else, and sync could fall back to refusing to edit.
# This binary also runs unattended, as a pre-commit hook and in CI, so
# change.dependency-bar's no-dependency default applies and is argued here:
# owning a format-preserving TOML editor costs more than this crate; it adds
# no build script and no network or process access (parse and display
# only); it comes from the toml-rs maintainers this tree already trusts
# through `toml`; and of its four new crates, toml_writer is toml-rs's too,
# hashbrown is rust-lang's, and indexmap and equivalent are indexmap-rs's,
# none with a build script. `sync --check` is the first TOML parser here
# that reads a file someone else wrote.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
strip = true
opt-level = "s"
lto = true
