id: names.reveal-intent/go-weak-name
valid:
  - "func f() { count := 1 }"
  - "for i := 0; i < 3; i++ {}"
  - "func f() { for p = range ps {} }"
  - "for i := range n {}"
  - "for _, path := range paths {}"
  - "for key, count := range counts {}"
  - "func run(count int) {}"
  - "func f() { total := d }"
  - "func f() { for path := range paths { total := len(p) } }"
  - "func f(names ...string) {}"
  - "func f(input any) { switch kind := input.(type) {} }"
  - "func f(input any) { switch input.(type) {} }"
  - "func f() { select { case msg := <-ch: } }"
  - "func f() { select { case m = <-ch: } }"
  - "const limit = 1"
  - "type R interface { Read(buf []byte) (count int, err error) }"
  - "type R interface { Read([]byte) (int, error) }"
invalid:
  - "func f(a ...string) {}"
  - "func f(input any) { switch v := input.(type) {} }"
  - "func f() { select { case m := <-ch: } }"
  - "const d = 1"
  - "const (\n\tlimit = 1\n\ttmp = 2\n)"
  - "type R interface { Read(p []byte) (count int, err error) }"
  - "type R interface { Read(buf []byte) (n int, err error) }"
  - "func f() { d := 1 }"
  - "func f() { result := load() }"
  - "var tmp int"
  - "func run(ctx int) {}"
  - "func (r Repo) run(n int) {}"
  - "func (r Repo) run() {}"
  - "fn := func(x int) int { return x }"
  - "for _, p := range ps {}"
  - "for key, v := range m {}"
  - "func f() { for n := 0; n < 3; n++ {} }"
  - "func run() (n int, err error) { return }"
